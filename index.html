<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>2026 Conference Reporting Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f3f4f6;
      font-family: Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 1700px;
      height: calc(100vh - 40px);
      margin: 0 auto;
    }

    .map-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    /* HEADER */

    .map-header {
      flex: 0 0 auto;
      padding: 20px 28px;
      background: #ffffff;
      border-bottom: 1px solid #ececec;
    }

    .map-title {
      margin: 0;
      color: #222222;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
    }

    .map-description {
      max-width: 780px;
      margin: 10px 0;
      color: #666666;
      font-size: 15px;
      line-height: 1.6;
    }

    .map-updated {
      margin: 0;
      color: #888888;
      font-size: 13px;
      line-height: 1.4;
    }

    /* MAP */

    .map-stage {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* LEGEND */

    .map-key {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 999;
      width: 205px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      pointer-events: none;
    }

    .key-title {
      margin-bottom: 12px;
      color: #333333;
      font-size: 13px;
      font-weight: 700;
    }

    .key-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: #444444;
      font-size: 13px;
      line-height: 1.3;
    }

    .key-item:last-child {
      margin-bottom: 0;
    }

    .key-dot {
      flex: 0 0 auto;
      width: 13px;
      height: 13px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.18);
    }

    .attending {
      background: #3076bc;
    }

    .missed {
      background: #f99c1c;
    }

    .pending {
      background: #3cb54a;
    }

    /* TABLET */

    @media screen and (max-width: 1000px) {
      body {
        padding: 12px;
      }

      .page {
        height: calc(100vh - 24px);
      }

      .map-header {
        padding: 18px 20px;
      }

      .map-title {
        font-size: 24px;
      }
    }

    /* MOBILE */

    @media screen and (max-width: 800px) {
      body {
        padding: 8px;
      }

      .page {
        height: calc(100vh - 16px);
      }

      .map-header {
        padding: 16px;
      }

      .map-title {
        font-size: 22px;
      }

      .map-description {
        margin: 8px 0;
        font-size: 14px;
        line-height: 1.45;
      }

      .map-updated {
        font-size: 12px;
      }

      .map-key {
        top: 10px;
        right: 10px;
        width: 170px;
        padding: 12px;
      }

      .key-title {
        margin-bottom: 9px;
        font-size: 12px;
      }

      .key-item {
        gap: 8px;
        margin-bottom: 8px;
        font-size: 11px;
      }

      .key-dot {
        width: 11px;
        height: 11px;
      }
    }

    /* SMALL MOBILE */

    @media screen and (max-width: 520px) {
      .map-header {
        padding: 13px 14px;
      }

      .map-title {
        font-size: 19px;
      }

      .map-description {
        display: none;
      }

      .map-key {
        top: 8px;
        right: 8px;
        width: 158px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="map-card">

      <header class="map-header">

        <h1 class="map-title">
          2026 Conference Reporting Dashboard
        </h1>

        <p class="map-description">
          Track conference coverage across North America in real time.
          View every scheduled conference, attendance status, location,
          and event detail from one interactive map.
        </p>

        <p class="map-updated">
          <strong>Last Updated:</strong>
          July 30, 2026
        </p>

      </header>

      <main class="map-stage">

        <div class="map-key" aria-label="Attendance status legend">

          <div class="key-title">
            Attendance Status
          </div>

          <div class="key-item">
            <span class="key-dot attending"></span>
            <span>Attended</span>
          </div>

          <div class="key-item">
            <span class="key-dot missed"></span>
            <span>Missed</span>
          </div>

          <div class="key-item">
            <span class="key-dot pending"></span>
            <span>Pending / Considering</span>
          </div>

        </div>

        <div id="map"></div>

      </main>

    </div>

  </div>

  <script src="mapdata.js"></script>
  <script src="namap.js"></script>

</body>
</html>
