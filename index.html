<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>HEN Conference Reporting Map</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: auto;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }

    .map-wrapper {
      width: 100%;
      max-width: 1400px;
      height: min(760px, calc(100vh - 40px));
      min-height: 500px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #e2e2e2;
      background: #ffffff;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    @media screen and (max-width: 800px) {
      .page {
        padding: 8px;
      }

      .map-wrapper {
        height: calc(100vh - 16px);
        min-height: 450px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="map-wrapper">
      <div id="map"></div>
    </div>
  </main>

  <script src="mapdata.js"></script>
  <script src="namap.js"></script>
</body>
</html>
